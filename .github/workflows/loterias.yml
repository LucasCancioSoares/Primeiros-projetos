name: Atualizar resultados das loterias

on:
  push:
    branches:
      - main
      - feature/simulador-loterias-v1
    paths:
      - 'simulador-loterias/**'
      - '.github/workflows/loterias.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *' # 23:15 em Brasilia (UTC-3)

permissions:
  contents: write

concurrency:
  group: loterias-data
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes e verificacao matematica
        working-directory: simulador-loterias
        run: python -m unittest discover -s tests -v
      - name: Atualizar resultados da Caixa
        if: github.ref == 'refs/heads/main'
        working-directory: simulador-loterias
        run: python lottery.py update --backfill 10
      - name: Gravar dados historicos no repositorio
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulador-loterias/data/resultados.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar concursos das loterias"
            git push
          fi
